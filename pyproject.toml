[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sqlserver-mcp"
version = "0.1.0"
description = "Read-only MCP server for Microsoft SQL Server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pyodbc>=4.0.39",
]

[project.scripts]
sqlserver-mcp = "sqlserver_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
